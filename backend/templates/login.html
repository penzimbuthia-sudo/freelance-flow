<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Freelance Flow</title>
  <link rel="stylesheet" href="/auth-assets/login.css">
</head>
<body>
  <main>
    <p>Freelance Flow · Sandbox workspace</p>
    <h1>Sign in to your workspace</h1>
    <p>Client payment links do not require this sign-in.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ destination }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="120" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
